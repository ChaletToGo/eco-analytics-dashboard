name: Deploy Dashboard (Docker) to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH usando Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Navega até o diretório correto na VPS
            cd ~/ChaletToGo
            
            # Atualiza o repositório no servidor
            git fetch origin main
            git reset --hard origin/main
            
            # Sobe a aplicação atualizada com Docker Compose
            docker compose up -d --build --remove-orphans
            
            # Limpa imagens antigas para poupar espaço em disco
            docker image prune -f