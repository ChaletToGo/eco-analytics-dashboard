name: Deploy Dashboard (Docker) to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH usando Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Garante a criação da estrutura de pastas
            mkdir -p ~/ChaletToGo/Dashboard
            cd ~/ChaletToGo/Dashboard

            # Se a pasta estiver vazia / não for um repo git, realiza o clone inicial
            if [ ! -d ".git" ]; then
              git clone https://github.com/ChaletToGo/eco-analytics-dashboard.git .
            fi

            # Atualiza o projeto para a versão mais recente da branch main
            git fetch origin main
            git reset --hard origin/main

            # Reconstrói a imagem Docker e sobe o container na porta 3200
            docker compose up -d --build --remove-orphans

            # Limpa imagens não utilizadas para poupar espaço em disco
            docker image prune -f